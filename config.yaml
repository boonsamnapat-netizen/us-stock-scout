# US Stock Scout — config
# ทุกค่าที่มีป้าย ASSUMPTION = ค่าตั้งต้นที่ยังไม่ได้ยืนยันกับเจ้าของ ให้แก้เป็นค่าจริง

universe:
  snapshot: data/universe.csv     # สำรองไว้ใช้ถ้าดึง Wikipedia ไม่ได้
  refresh_from_wikipedia: true    # S&P 500 + Nasdaq-100 ล่าสุดทุกครั้งที่รัน

benchmark: SPY
extra_benchmarks: [QQQ]
history_years: 6                  # ราคาย้อนหลัง (ใช้ทั้งคำนวณและทดสอบย้อนหลัง)

fees:
  # ASSUMPTION (เจ้าของยืนยันให้ใช้ไปก่อน 9 ต.ค. 2026 — ยังไม่รู้ส่วนต่างค่าเงินจริงของ Dime)
  per_side_pct: 0.10

short:                            # ระยะสั้น = ถือ ~4 สัปดาห์
  horizon_days: 20                # 20 วันทำการ ≈ 4 สัปดาห์

report:
  top_n: 5                        # จำนวนหุ้นต่อระยะ (เจ้าของเลือก 5)
  per_sector: 2                   # หุ้นเด่นต่ออุตสาหกรรม
  detail_n: 3                     # วิเคราะห์ละเอียดกี่ตัวต่อระยะ
  min_analysts: 5                 # ใช้ราคาเป้าเฉพาะหุ้นที่นักวิเคราะห์ >= เท่านี้

backtest:
  top_n: 5                        # ให้ตรงกับจำนวนหุ้นที่แสดง
  min_history_days: 273           # ต้องมีราคา >= 1 ปี + 1 เดือนก่อนเริ่มทดสอบ

model_portfolio:                  # กติกา E3 (เจ้าของเลือก) — ทดสอบย้อนหลังใน research_portfolio.py
  n_hold: 5                       # ถือ 5 ตัว
  entry_pct: 0.10                 # ซื้อเฉพาะคะแนนโมเมนตัม 10% บน
  exit_pct: 0.30                  # ขายเมื่อหลุด 30% บน (หรือหลุดเส้น 200 วัน)
  max_vol: 0.60                   # ไม่ซื้อหุ้นผันผวนเกิน 60%/ปี
  gate_sma: 200                   # SPY ต่ำกว่าเส้น 200 วัน = ขายหมด ถือเงินสด
  max_trades_month: 5             # Dime แพ็กเกจฟรี 5 ครั้ง/เดือน
