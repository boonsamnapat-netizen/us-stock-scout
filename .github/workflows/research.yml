name: Research - portfolio rules

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of price history"
        default: "11"
      fee:
        description: "Cost per side in % (assumption)"
        default: "0.10"
      fundamentals:
        description: "Run SEC EDGAR fundamental variants (F1-F3)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdir -p output && python -u research_portfolio.py --years "${{ inputs.years }}" --fee "${{ inputs.fee }}" ${{ inputs.fundamentals && '--fundamentals' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-output
          path: output/
