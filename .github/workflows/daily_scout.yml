name: Daily US Stock Scout

on:
  # PAUSED 2026-10-09 by owner ("หยุดทุกอย่าง") — model portfolio E3/F stopped; moving to the scout.
  # schedule:
  #   # 23:15 UTC Mon–Fri = after US close (both EDT/EST) = 06:15 Thai time Tue–Sat
  #   - cron: "15 23 * * 1-5"
  workflow_dispatch:
    inputs:
      notify:
        description: "Send to Telegram"
        type: boolean
        default: true
      limit:
        description: "Only first N tickers (0 = all) — for quick tests"
        default: "0"

permissions:
  contents: write        # commit data/model_portfolio.json

concurrency:
  group: daily-scout     # never let two runs update the model portfolio at once
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Scan + report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="--notify --skip-stale"
          elif [ "${{ inputs.notify }}" = "true" ]; then
            ARGS="--notify"
          fi
          python scout_run.py $ARGS --limit "${{ inputs.limit || '0' }}"
      - name: Save model portfolio state
        if: success()
        run: |
          git config user.name "scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/model_portfolio.json data/model_portfolio_f.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "model portfolio: $(date -u +%F)"
          git pull --rebase origin main && git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scout-output
          path: output/
          retention-days: 30
