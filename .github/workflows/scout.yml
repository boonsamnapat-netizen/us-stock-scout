name: Stock Scout

on:
  schedule:
    # 23:15 UTC Mon–Fri = after US close = 06:15 Thai time Tue–Sat
    # Friday's close (Saturday morning TH) -> weekly report; other days -> alerts only when something new
    - cron: "15 23 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | weekly | daily"
        default: "weekly"
      notify:
        description: "Send to Telegram"
        type: boolean
        default: true
      limit:
        description: "Only first N tickers (0 = all) — quick test, does not update state"
        default: "0"

permissions:
  contents: write        # commit data/scout_state.json (yesterday's chart stages, for new-signal alerts)

concurrency:
  group: stock-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Scout
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -u scout_main.py --mode auto --notify --skip-stale
          else
            ARGS="--mode ${{ inputs.mode }} --limit ${{ inputs.limit }}"
            [ "${{ inputs.notify }}" = "true" ] && ARGS="$ARGS --notify"
            python -u scout_main.py $ARGS
          fi
      - name: Save scout state
        if: success()
        run: |
          git config user.name "scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scout_state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "scout state: $(date -u +%F)"
          git pull --rebase origin main && git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scout-output
          path: output/
          retention-days: 30
