name: Research - scout chart stages

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of price history"
        default: "11"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -u research_stages.py --years "${{ inputs.years }}"
